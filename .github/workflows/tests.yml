name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none

      # Laravel Nova is a paid package and cannot be installed here; these tests do not need it
      # (tests/Nova skips itself without Nova).
      - name: Drop Nova dependencies
        run: |
          composer remove laravel/nova --no-update --no-interaction
          composer remove --dev laravel/nova-devtool --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS tests
        run: node --test 'tests/js/*.test.mjs'
